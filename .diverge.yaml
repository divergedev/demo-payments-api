# yaml-language-server: $schema=https://divergedev.com/schemas/diverge.schema.json
version: "1"

services:
  payments-api:
    paths:
      - "**/*.go"
      - "Dockerfile"
      - "deploy/**"
    image:
      repository: ghcr.io/divergedev/demo-payments-api
      tag_template: "pr-{{.PR}}"

defaults:
  deploy:
    mode: delta
    namespace: same
  routing:
    mode: header
    baseline_namespace: demo-bank
    header_key: x-preview-id
  database:
    mode: schema
  lifecycle:
    ttl: 24h
    cleanup_on_merge: true
